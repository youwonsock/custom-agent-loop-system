name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-build-test:
    name: ${{ matrix.os }} / Node 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run pack:check
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run typecheck
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - run: npm audit --audit-level=high
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - run: node vscode-extension/core/dist/loop_orchestrator.js --help
      - uses: actions/upload-artifact@v4
        with:
          name: agent-loop-vsix-${{ matrix.os }}
          path: vscode-extension/agent-loop-vscode-*.vsix
          if-no-files-found: error

  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run coverage
