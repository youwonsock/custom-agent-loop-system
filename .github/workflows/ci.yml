name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-build-test:
    name: ${{ matrix.os }} / Node 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run generated:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run pack:check
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run typecheck
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - run: npm run verify:vsix
      - run: npm run checksum:artifacts
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: 18
      - if: runner.os == 'Linux'
        name: Verify the same packaged artifact on Node 18
        run: npm run verify:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: agent-loop-vsix-${{ matrix.os }}
          path: |
            vscode-extension/agent-loop-vscode-*.vsix
            vscode-extension/agent-loop-vscode-*.vsix.sha256
            vscode-extension/agent-loop-vscode-*.vsix.cdx.json
          if-no-files-found: error

  node-18-compatibility:
    name: Root runtime / Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run sbom
      - run: npm ci
        working-directory: vscode-extension
      - run: npm audit --audit-level=high
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v7
        with:
          name: agent-loop-sbom
          path: artifacts/agent-loop-npm-runtime-sbom.cdx.json
          if-no-files-found: error

  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run coverage
