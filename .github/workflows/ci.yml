name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source / ${{ matrix.os }} / Node 20
    needs: verification-helper
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - run: npm ci
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-helper-win32-x64
          path: native/bin/win32-x64
      - run: npm run generated:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  node-18-source:
    name: Source / Ubuntu / minimum Node 18
    needs: verification-helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  verification-helper:
    name: Build Windows verification helper / win32-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build helper
        shell: pwsh
        run: .\scripts\build\build-verification-helper.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-helper-win32-x64
          path: native/bin/win32-x64/*
          if-no-files-found: error
          retention-days: 30

  desktop-e2e:
    name: Electron desktop development smoke
    needs: verification-helper
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-helper-win32-x64
          path: native/bin/win32-x64
      - run: npm run bundle:desktop-core
      - run: npm ci --ignore-scripts
        working-directory: desktop-app
      - run: npm run build
        working-directory: desktop-app
      - run: npm run test:utility
        working-directory: desktop-app
      - run: npm run test:e2e
        working-directory: desktop-app

  coverage:
    name: Core coverage thresholds
    needs: verification-helper
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-helper-win32-x64
          path: native/bin/win32-x64
      - run: npm run coverage

  supply-chain:
    name: Dependency audit and runtime SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --ignore-scripts
        working-directory: desktop-app
      # Forge/webpack are build-only tooling and are not shipped in the
      # desktop runtime. Audit the installed production dependency graph here;
      # the root runtime graph is audited above with the same high threshold.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop-app
      - run: npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostic-runtime-sbom
          path: artifacts/agent-loop-npm-runtime-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  npm-candidate:
    name: Build npm candidate once
    needs:
      - source-validation
      - verification-helper
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-helper-win32-x64
          path: native/bin/win32-x64
      - run: npm run package:npm
      - run: npm run sbom:npm-artifact
      - run: npm run verify:npm-artifact
      - run: npm run verify:release-bundle -- artifacts/npm --expected-commit ${{ github.sha }}
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/npm/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-npm
          path: artifacts/npm/*
          if-no-files-found: error
          retention-days: 30

  npm-artifact-matrix:
    name: Exact npm artifact / ${{ matrix.os }} / Node 18
    needs: npm-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 18
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-npm
          path: artifacts/npm
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-helper-win32-x64
          path: native/bin/win32-x64
      - run: npm run verify:npm-artifact
      - run: npm run verify:release-bundle -- artifacts/npm --expected-commit ${{ github.sha }}

  desktop-candidate:
    name: Exact Windows portable desktop / win32-x64 / Node 22.20
    needs:
      - source-validation
      - verification-helper
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-helper-win32-x64
          path: native/bin/win32-x64
      - run: npm run bundle:desktop-core
      - run: npm ci
        working-directory: desktop-app
      - name: Assert native candidate target
        run: node -e "const actual=process.platform+'-'+process.arch;if(actual!=='win32-x64')throw new Error(actual+' != win32-x64')"
      - name: Build the one Windows candidate
        run: npm run package:portable
        working-directory: desktop-app
      - name: Verify release Electron fuse wire
        run: npm run verify:fuses
        working-directory: desktop-app
      - name: Smoke the Electron ABI native PTY
        run: npm run test:native
        working-directory: desktop-app
      - name: Smoke the Electron utility-process core
        run: npm run test:utility
        working-directory: desktop-app
      - run: node scripts/package/package-desktop-artifact.js
      - run: npm run verify:desktop
      - run: npm run checksum:artifacts
      - run: npm run verify:release-bundle -- artifacts/desktop --expected-commit ${{ github.sha }} --expected-count 1 --expected-desktop-targets win32-x64
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/desktop/**/agent-loop-orchestrator.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-win32-x64
          path: |
            artifacts/desktop/AgentLoopOrchestrator-*
          if-no-files-found: error
          retention-days: 30

  # The release candidate is created once on Windows and the exact portable
  # directory is promoted; no other OS/native candidate is produced for v8.
  desktop-packaged-smoke:
    name: Packaged desktop smoke
    needs: desktop-candidate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - name: Install root verification tools
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-desktop-win32-x64
          path: artifacts/desktop
      - run: npm run verify:desktop
      - name: Launch the exact portable executable
        shell: pwsh
        run: |
          $portable = (Get-ChildItem artifacts/desktop -Directory -Filter 'AgentLoopOrchestrator-*-win32-x64' | Select-Object -First 1).FullName
          if (-not $portable) { throw 'Portable desktop candidate is missing.' }
          node desktop-app/scripts/packaged-smoke.cjs $portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-smoke-evidence
          path: |
            artifacts/desktop/*.manifest.json
          if-no-files-found: error
          retention-days: 30

  release-gate:
    name: Protected release candidate gate
    if: always()
    needs:
      - source-validation
      - node-18-source
      - desktop-e2e
      - coverage
      - supply-chain
      - npm-artifact-matrix
      - desktop-candidate
      - desktop-packaged-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source, coverage, supply-chain, and exact-artifact job
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: node -e "const needs=JSON.parse(process.env.NEEDS_JSON);const failed=Object.entries(needs).filter(([,v])=>v.result!=='success');if(failed.length)throw new Error(JSON.stringify(failed));"
