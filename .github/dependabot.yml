version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      core-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /desktop-app
    schedule:
      interval: weekly
    groups:
      desktop-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /experiments/langgraph
    schedule:
      interval: weekly
    groups:
      langgraph-evaluation-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
